name: Upload Zebrafy to PyPI Upon a Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pypi-publish:
    name: Publish release to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zebrafy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check that the version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls dist/
          version="${TAG#v}"
          if [ ! -f "dist/zebrafy-${version}.tar.gz" ]; then
              echo "Built version does not match release tag ${TAG}."
              exit 1
          fi
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
