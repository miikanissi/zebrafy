[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "zebrafy"
dynamic = ["version"]
description = "Python library for converting PDF and images to Zebra Programming Language (ZPL)"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Manufacturing",
    "Topic :: Printing",
]
dependencies = ["pillow", "pypdfium2>=5.0.0"]
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.txt"]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "sphinx_autodoc_typehints>=2.0.0",
    "sphinx_rtd_theme>=2.0.0",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
lint = [
    "pre-commit",
]
build = [
    "build",
    "twine",
]

[[project.authors]]
name = "Miika Nissi"
email = "miika@miikanissi.com"

[[project.maintainers]]
name = "Miika Nissi"
email = "miika@miikanissi.com"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/miikanissi/zebrafy/"
Documentation = "https://zebrafy.readthedocs.io/"
Source = "https://github.com/miikanissi/zebrafy"
Issues = "https://github.com/miikanissi/zebrafy/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = [ "zebrafy"]
namespaces = false

[tool.setuptools_scm]
version_file = "zebrafy/_version.py"
version_scheme = "no-guess-dev"

[tool.pytest.ini_options]
addopts = "--cov --cov-report html --cov-report term-missing --cov-fail-under 95"

[tool.coverage.run]
source = ["zebrafy"]
