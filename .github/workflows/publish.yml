name: Upload Zebrafy to PyPI Upon a Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pypi-publish:
    name: Publish release to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zebrafy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Check that the version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls dist/
          version="${TAG#v}"
          if [ ! -f "dist/zebrafy-${version}.tar.gz" ]; then
              echo "Built version does not match release tag ${TAG}."
              exit 1
          fi
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
