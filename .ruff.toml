fix = true

[lint]
extend-select = [
    "B", # flake8-bugbear
    "C90", # mccabe
    "I",  # isort
    "E501", # line too long (default to 88)
    "UP",  # pyupgrade
    "D", # pydocstyle
]
exclude = ["setup/*"]
ignore = ["D100", "D107", "D203", "D212"]

[format]
exclude = ["setup/*"]
docstring-code-format = true

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # ignore unused and unsorted imports in __init__.py

[lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.flake8-bugbear]
# Dataclass field factories return immutable dataclasses.Field objects
extend-immutable-calls = [
    "zebrafy._validation.validated_field",
    "zebrafy.graphic_field.format_field",
    "zebrafy.graphic_field.string_line_break_field",
    "zebrafy.options.dpi_field",
]

[lint.mccabe]
max-complexity = 16
